name: Mazda TI portable evaluation

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  evaluation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Controller/limiter fixtures require pinned historical commits.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install numpy==2.5.2 pycapnp==2.2.4 pytest==9.1.1
      - name: Run portable tools and public end-to-end reference
        run: python -m pytest -c tools/mazda_ti/pytest.ini --confcutdir=tools/mazda_ti tools/mazda_ti
